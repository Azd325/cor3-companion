<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COR3 Companion</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 300px; background: #08121a; color: #cfe7ee;
         font: 12px/1.45 ui-monospace, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
           background: #10222b; border-bottom: 1px solid #2d4a55; }
  header img { width: 24px; height: 24px; }
  header b { flex: 1; color: #76c1d1; letter-spacing: .05em; font-size: 13px; }
  header span { color: #7f9aa3; font-size: 11px; }
  ul { list-style: none; margin: 0; padding: 4px 0; }
  li { display: flex; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #16262e; }
  li:last-child { border-bottom: none; }
  .txt { flex: 1; }
  .name { color: #e6f6fa; font-weight: 700; }
  .desc { color: #9fb6bd; font-size: 11px; }
  .warn { color: #ffa040; font-size: 11px; margin-top: 2px; }
  kbd { align-self: flex-start; white-space: nowrap; padding: 1px 6px; border: 1px solid #2d4a55;
        border-bottom-width: 2px; border-radius: 4px; background: #10222b; color: #5df0a0; font: inherit; }
  .ctl { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .sw { position: relative; width: 34px; height: 18px; padding: 0; border: 1px solid #2d4a55; border-radius: 9px;
        background: #16262e; cursor: pointer; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
               background: #7f9aa3; transition: left .12s; }
  .sw[aria-checked="true"] { background: #144d30; border-color: #2fae6a; }
  .sw[aria-checked="true"]::after { left: 18px; background: #5df0a0; }
  .sw:disabled { opacity: .35; cursor: default; }
  footer { padding: 8px 12px; color: #7f9aa3; font-size: 11px; border-top: 1px solid #2d4a55; }
  footer a { color: #76c1d1; }
</style>
</head>
<body>
<header>
  <img src="../icons/icon-48.png" alt="">
  <b>COR3 COMPANION</b>
  <span id="version"></span>
</header>
<!-- One row per helper, made by popup.js from shared/helpers-list.js. -->
<ul id="helpers"></ul>
<footer><span id="hint">Switch a helper here or with its shortcut while cor3.gg is open.</span>
  <a href="https://github.com/nvanderwaal/cor3-companion#readme" target="_blank" rel="noopener">Help</a></footer>
<script src="../shared/helpers-list.js"></script>
<script src="popup.js"></script>
<script src="update-check.js"></script>
</body>
</html>
