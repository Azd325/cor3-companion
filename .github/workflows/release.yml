# Bumps the version, builds Chrome + Firefox packages, signs the Firefox one
# with Mozilla (unlisted) and publishes both as a GitHub release.
#
# Runs on every push to main (patch bump) or by hand from the Actions tab,
# where you can pick patch/minor/major.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   WEB_EXT_API_KEY     your AMO JWT issuer
#   WEB_EXT_API_SECRET  your AMO JWT secret
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - ".env.example"
      - ".gitattributes"
      - ".github/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A normal run takes 3-5 minutes (most of it is Mozilla approving the
    # signature, "Waiting for approval..."); stop a stuck signing step instead of
    # letting it run for GitHub's default 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bump version
        id: version
        run: |
          VERSION=$(node bump.mjs "${{ github.event.inputs.bump || 'patch' }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Build and sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          # Installed Firefox copies check this file for updates.
          FIREFOX_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/updates.json
        run: |
          rm -rf web-ext-artifacts
          node sign.mjs

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp web-ext-artifacts/*.xpi release/cor3-helper-firefox.xpi
          cp dist/cor3-helper-chrome.zip release/cor3-helper-chrome.zip
          ID=$(node -p "require('./manifest.json').browser_specific_settings.gecko.id")
          LINK="https://github.com/${{ github.repository }}/releases/download/v$VERSION/cor3-helper-firefox.xpi"
          node -e '
            const [id, version, link] = process.argv.slice(1);
            const out = { addons: { [id]: { updates: [{ version, update_link: link }] } } };
            require("fs").writeFileSync("release/updates.json", JSON.stringify(out, null, 2));
          ' "$ID" "$VERSION" "$LINK"
          ls -la release

      - name: Commit version and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          # Pushes made with GITHUB_TOKEN don't start this workflow again.
          git push origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --title "v$VERSION" \
            --notes "Firefox: open cor3-helper-firefox.xpi in Firefox to install (it updates itself after that).
          Chrome: unzip cor3-helper-chrome.zip over your extension folder and click reload in chrome://extensions."
