# Bumps the version, builds Chrome + Firefox packages, publishes the Firefox
# one on addons.mozilla.org (listed), makes a GitHub release with both, and
# submits the Chrome one to the Chrome Web Store.
#
# Runs only by hand: Actions > Release > Run workflow, where you pick
# patch/minor/major. Merging to main never releases, so several PRs can go out
# together as one version.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   WEB_EXT_API_KEY, WEB_EXT_API_SECRET   AMO JWT issuer and secret
#   CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN,
#   CHROME_PUBLISHER_ID, CHROME_EXTENSION_ID
#                                         Chrome Web Store API (the Chrome
#                                         step is skipped until these are set)
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A normal run takes 3-5 minutes (most of it is Mozilla approving the
    # version, "Waiting for approval..."); stop a stuck run instead of letting
    # it run for GitHub's default 6 hours. sign.mjs gives up waiting after 5.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bump version
        id: version
        run: |
          VERSION=$(node scripts/bump.mjs "${{ github.event.inputs.bump || 'patch' }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      # Moves CHANGELOG.md's "Unreleased" section under the new version and
      # writes it to notes.md for the release (the merged PR titles if empty).
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog.mjs "$VERSION" notes.md

      # Submits the version to AMO's listed channel. Exit code 3 means Mozilla
      # has it but wants a human review first: AMO publishes it once approved,
      # and this release goes out without the .xpi.
      - name: Build and sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          AMO_CHANNEL: listed
        run: |
          rm -rf web-ext-artifacts
          node scripts/sign.mjs || [ $? -eq 3 ]

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp dist/cor3-companion-chrome.zip release/cor3-companion-chrome.zip
          XPI=$(ls web-ext-artifacts/*.xpi 2>/dev/null | head -n1 || true)
          if [ -z "$XPI" ]; then
            echo "No signed .xpi yet (Mozilla is reviewing $VERSION); releasing without it."
            ls -la release
            exit 0
          fi
          cp "$XPI" release/cor3-companion-firefox.xpi
          # Copies installed from a GitHub .xpi before the AMO listing check this
          # file. The .xpi it points to has no update_url, so once they install it
          # they update from addons.mozilla.org like everyone else.
          ID=$(node -p "require('./src/manifest.json').browser_specific_settings.gecko.id")
          LINK="https://github.com/${{ github.repository }}/releases/download/v$VERSION/cor3-companion-firefox.xpi"
          node -e '
            const [id, version, link] = process.argv.slice(1);
            const out = { addons: { [id]: { updates: [{ version, update_link: link }] } } };
            require("fs").writeFileSync("release/updates.json", JSON.stringify(out, null, 2));
          ' "$ID" "$VERSION" "$LINK"
          ls -la release

      - name: Commit version and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifest.json CHANGELOG.md
          git commit -m "Release v$VERSION"
          # Something may have been merged while Mozilla was signing: put the
          # version commit on top of it rather than failing the push.
          git pull --rebase origin main
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat >> notes.md <<'EOF'

          ---

          ### Install or update

          **Firefox:** click `cor3-companion-firefox.xpi` to install (it updates itself after that). If it isn't here yet,
          Mozilla is still reviewing this version: it's added automatically once approved, until then use the previous release's.
          **Chrome:** unzip `cor3-companion-chrome.zip` over your extension folder and click reload in `chrome://extensions`.
          Copies from the Chrome Web Store or Firefox Add-ons update by themselves, once the store has reviewed the version.

          Every version's changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

          Find it useful? [Buy me a coffee ☕](https://buymeacoffee.com/nvanderwaal)
          EOF
          gh release create "v$VERSION" release/* --title "v$VERSION" --notes-file notes.md

      # Last, so a Chrome problem never holds back the release itself.
      - name: Submit to the Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: node scripts/chrome-upload.mjs
