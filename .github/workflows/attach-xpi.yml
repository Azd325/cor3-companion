# Adds Mozilla's signed .xpi to releases that went out without it, once
# Mozilla has approved the version (see scripts/attach-xpi.mjs). Runs every
# hour and does nothing when every recent release already has its .xpi.
name: Attach Firefox file

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Attach approved .xpi files
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: node scripts/attach-xpi.mjs
